  overheid:
    container_name: overheid
    image: eluinstra/ebms-adapter-bin:2.20.4
    environment:
      ebms_verifyHostnames: "false"
      https_verifyHostnames: "false"
      ebms_jdbc_update: "true"
      # The pinned image predates the TLS 1.3 default, so allow both TLS 1.2
      # and TLS 1.3 (with the TLS 1.3 suites) here to match the freshly built
      # adapter and let the smoke test negotiate TLS 1.3.
      https_protocols: "TLSv1.2,TLSv1.3"
      https_cipherSuites: "TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
    command: "./start.sh -h2 -soap -health"
    expose:
      - 8080
      - 8888
    ports:
      - "8000:8080"
      - "8088:8888"
    extra_hosts: 
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: "curl -f http://localhost:8008/health"
      start_period: 3s
      interval: 5s
      timeout: 5s
      retries: 10
  overheid_init:
    image: alpine/curl:latest
    depends_on:
      overheid:
        condition: service_healthy
    environment:
      CPA_FILE: cpa.xml
    entrypoint: /bin/sh -c
    command: |
      "
        curl -L https://raw.githubusercontent.com/eluinstra/ebms-admin/refs/heads/ebms-admin-2.20.x/resources/CPAs/cpaStubEBF.rm.https.signed.xml -o cpa.xml && \
        curl -X POST -H \"Content-Type: text/plain\" --data @cpa.xml http://overheid:8080/service/rest/v19/cpas?overwrite=true && \
        curl -X POST -H \"Content-Type: application/json\" --data '{\"source\": \"https://localhost:8888/ebms\", \"destination\": \"https://host.docker.internal:8888/ebms\" }' http://overheid:8080/service/rest/v19/urlMappings
      "
